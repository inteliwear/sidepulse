[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sidepulse"
dynamic = ["version"]
description = "Command-line and macOS tools for SidePulse Pro and SidePulse Dot."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Kuhar", email = "peter@pkuhar.com" }]
keywords = ["sidepulse", "led", "macbook", "agent", "status", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ScriptingBridge>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://sidepulse.io"
Repository = "https://github.com/inteliwear/sidepulse"
Issues = "https://github.com/inteliwear/sidepulse/issues"

[project.optional-dependencies]
# Kept for backwards compatibility; the status-bar dependencies are installed by
# default now, so this extra is a no-op alias.
status-bar = []
reply-classifier = ["mlx-lm>=0.24,<1"]
test = [
    "pytest>=7",
    # tests/test_packaging.py reads pyproject.toml; tomllib is 3.11+.
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
sidepulse = "sidepulse.cli:sidepulse_main"
agent-monitor = "sidepulse.cli:main"
agent-status-bar = "sidepulse.status_bar:main"
sidepulse-reply = "sidepulse.reply_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sidepulse*", "agent_monitor*", "sidepulse_cli*"]

[tool.setuptools.package-data]
"sidepulse.resources" = ["sd_eject_guard.c", "sdled.wasm", "animations/*.LED"]

[tool.setuptools_scm]
fallback_version = "0"
