[workspace]
members = ["crates/sidepulse-core", "crates/sidepulse-sources", "crates/sidepulse-hook-config", "crates/sidepulse-ipc", "crates/sidepulse-daemon", "crates/sidepulse-cli", "crates/sidepulse-ui-model", "crates/sidepulse-tray", "crates/sidepulse-device", "crates/sidepulse-relay"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/inteliwear/sidepulse"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
interprocess = "2.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
