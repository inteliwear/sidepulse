[package]
name = "sidepulse-reply"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sidepulse-next-reply"
path = "src/main.rs"

[dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-transformers = { version = "=0.9.2", default-features = false }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
ureq = {version="=2.12.1",default-features=false,features=["tls"]}
