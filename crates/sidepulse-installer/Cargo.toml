[package]
name = "sidepulse-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sidepulse-next-stage"
path = "src/main.rs"

[dependencies]
zip = { version = "7.2", default-features = false }
sha2 = "0.10"
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
sidepulse-core = { path = "../sidepulse-core" }
sidepulse-ipc = { path = "../sidepulse-ipc" }
sidepulse-helpers = { path = "../sidepulse-helpers" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
