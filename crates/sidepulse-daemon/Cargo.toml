[package]
name = "sidepulse-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sidepulse-next-service"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5", features = ["termination"] }
uuid = { version = "1", features = ["v4"] }
sidepulse-links = { path = "../sidepulse-links" }
chrono.workspace = true
interprocess.workspace = true
serde_json.workspace = true
sidepulse-core = { path = "../sidepulse-core" }
sidepulse-device = { path = "../sidepulse-device" }
sidepulse-ipc = { path = "../sidepulse-ipc" }
sidepulse-relay = { path = "../sidepulse-relay" }
sidepulse-sources = { path = "../sidepulse-sources" }
sidepulse-hook-config = { path = "../sidepulse-hook-config" }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
