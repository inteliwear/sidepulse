[package]
name = "sidepulse-settings-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sidepulse-next-settings"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
sidepulse-ui-client = { path = "../sidepulse-ui-client" }
sidepulse-ui-model = { path = "../sidepulse-ui-model" }
sidepulse-device = { path = "../sidepulse-device" }
sidepulse-core = { path = "../sidepulse-core" }
sidepulse-installer = { path = "../sidepulse-installer" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }

tauri-plugin-clipboard-manager = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
