name: Build and Deploy iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, sign, upload, and assign
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.massimo.sidepulse
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: SidePulse App Store
      INTERNAL_GROUP: Personal Testing
      XCODE_PROJECT: ios/SidePulse/SidePulse.xcodeproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -runFirstLaunch || true

      - name: Validate secrets
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
        run: |
          for variable in APPSTORE_API_KEY_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_KEY_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!variable}" ] || { echo "Missing required secret: $variable"; exit 1; }
          done

      - name: Stage App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install App Store Connect tools
        run: |
          ASC_VENV="$RUNNER_TEMP/asc-venv"
          python3 -m venv "$ASC_VENV"
          "$ASC_VENV/bin/pip" install pyjwt cryptography
          echo "ASC_PYTHON=$ASC_VENV/bin/python" >> "$GITHUB_ENV"

      - name: Register app in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ASC_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          ASC_APP_NAME: SidePulse
          ASC_APP_SKU: sidepulse-ios
          ASC_PRIMARY_LOC: en-US
        run: "$ASC_PYTHON scripts/ios/create-ios-asc-app.py"

      - name: Generate App Store distribution certificate
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ASC_CERTIFICATE_CSR_PATH: ${{ runner.temp }}/distribution/distribution.csr.pem
        run: |
          CERT_WORKDIR="$RUNNER_TEMP/distribution"
          CERT_KEY_PATH="$CERT_WORKDIR/distribution.key.pem"
          CERT_CSR_PATH="$CERT_WORKDIR/distribution.csr.pem"
          CERT_CER_PATH="$CERT_WORKDIR/distribution.cer"
          CERT_PEM_PATH="$CERT_WORKDIR/distribution.pem"
          CERT_P12_PATH="$CERT_WORKDIR/distribution.p12"
          CERT_P12_PASSWORD="$(openssl rand -base64 24)"
          mkdir -p "$CERT_WORKDIR"
          openssl req -new -newkey rsa:2048 -nodes -keyout "$CERT_KEY_PATH" -out "$CERT_CSR_PATH" \
            -subj "/CN=SidePulse CI/O=SidePulse CI/C=CH"
          CERT_JSON=$("$ASC_PYTHON" scripts/ios/create-ios-distribution-certificate.py)
          CERTIFICATE_ID=$(printf '%s' "$CERT_JSON" | jq -r '.id')
          printf '%s' "$CERT_JSON" | jq -r '.certificateContent' | base64 --decode > "$CERT_CER_PATH"
          openssl x509 -inform DER -in "$CERT_CER_PATH" -out "$CERT_PEM_PATH"
          openssl pkcs12 -export -inkey "$CERT_KEY_PATH" -in "$CERT_PEM_PATH" -out "$CERT_P12_PATH" \
            -passout pass:"$CERT_P12_PASSWORD"
          SIGNING_IDENTITY=$(openssl x509 -in "$CERT_PEM_PATH" -noout -subject -nameopt RFC2253 \
            | sed -E 's/^subject=.*CN=([^,]+).*$/\1/')
          {
            echo "CERT_WORKDIR=$CERT_WORKDIR"
            echo "CERTIFICATE_ID=$CERTIFICATE_ID"
            echo "CERT_P12_PATH=$CERT_P12_PATH"
            echo "CERT_P12_PASSWORD=$CERT_P12_PASSWORD"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Generate App Store provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ASC_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          ASC_PROFILE_NAME: ${{ env.PROFILE_NAME }}
          ASC_PROFILE_TYPE: IOS_APP_STORE
          ASC_CERTIFICATE_IDS: ${{ env.CERTIFICATE_ID }}
        run: |
          PROFILE_BASE64=$("$ASC_PYTHON" scripts/ios/create-ios-provisioning-profile.py)
          PROFILE_PATH="$RUNNER_TEMP/SidePulse.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/SidePulse.plist"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_SPECIFIER=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_SPECIFIER=$PROFILE_SPECIFIER"
          } >> "$GITHUB_ENV"

      - name: Import distribution certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_P12_PATH" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eq '[1-9][0-9]* valid identities found'
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "SIGNING_CERT_COMMON_NAME=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Prepare release build inputs
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          VERSION="1.0.$BUILD_NUMBER"
          # App Store builds must ship the production APNs environment; the
          # checked-in entitlements target local development, and codesign
          # rejects a mismatch against the App Store profile.
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" \
            ios/SidePulse/SidePulse/SidePulse.entitlements
          {
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Archive iOS app
        run: |
          XCARCHIVE="$RUNNER_TEMP/SidePulse.xcarchive"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme SidePulse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$XCARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_CERT_COMMON_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          echo "XCARCHIVE=$XCARCHIVE" >> "$GITHUB_ENV"

      - name: Export IPA
        run: |
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string 'app-store-connect'" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :destination string 'export'" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string 'manual'" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string '$APPLE_TEAM_ID'" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string '$PROFILE_SPECIFIER'" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :testFlightInternalTestingOnly bool true" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$XCARCHIVE" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          [ -n "$IPA_PATH" ]
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_KEY_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          ! grep -q "UPLOAD FAILED\|Failed to upload package\|VALIDATION_ERROR" "$RUNNER_TEMP/altool.log"

      - name: Wait for processing and enable internal testing
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          ASC_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          ASC_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          ASC_INTERNAL_GROUP: ${{ env.INTERNAL_GROUP }}
        run: "$ASC_PYTHON scripts/ios/finalize-testflight.py"

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/private_keys/AuthKey_"*.p8 || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
          rm -rf "$CERT_WORKDIR" || true
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Summary
        run: |
          echo "## SidePulse TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle: $BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Internal group: $INTERNAL_GROUP" >> "$GITHUB_STEP_SUMMARY"
