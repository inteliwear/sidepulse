name: Rust migration

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release --bins
      - run: cargo run --release -p sidepulse-installer --bin sidepulse-next-stage -- --source-dir target/release --stage-dir target/sidepulse-preview
      - uses: actions/upload-artifact@v4
        with:
          name: sidepulse-rust-preview-${{ matrix.os }}
          if-no-files-found: error
          path: target/sidepulse-preview/
