name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # so the release pipeline can gate on this

jobs:
  linux:
    name: Linux CLI / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest tests -q

      - name: TLDR installer and SidePulse Dot smoke test
        run: |
          smoke_home="$(mktemp -d)"
          export HOME="$smoke_home"
          SIDEPULSE_INSTALL_SPEC="$GITHUB_WORKSPACE" \
            PYTHON_BIN=python \
            sh scripts/setup.sh
          "$smoke_home/.local/bin/sidepulse" --help
          printf '%064d\n' 0 | "$smoke_home/.local/bin/sidepulse" link >/dev/null
          "$smoke_home/.local/bin/sidepulse" link AbCdEfGhIjKlMnOpQrStUv
          "$smoke_home/.local/bin/sidepulse" push "off" --dry-run
          mkdir -p "$smoke_home/media/SidePulseDot"
          "$smoke_home/.local/bin/sidepulse" write "off" \
            --device "$smoke_home/media/SidePulseDot"
          test "$(cat "$smoke_home/media/SidePulseDot/LEDS.LED")" = "off"

  macos:
    name: macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install from pyproject alone. If a dependency is missing from the
      # declared list, it is missing here too, and the import contract tests
      # in tests/test_packaging.py fail -- which is the whole point.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Import contract
        run: python -m pytest tests/test_packaging.py -v

      # Builds an empty virtualenv and installs from pyproject.toml alone,
      # then runs the real commands against it. An undeclared dependency is
      # simply absent there, which is how the ScriptingBridge bug reached a
      # user in the first place.
      - name: Clean-room install
        run: python -m pytest tests/test_environment.py -v

      - name: Agent hook stability
        run: python -m pytest tests/test_hook_stability.py -v

      # Fails rather than skips if AppKit is unavailable: macOS runners have a
      # window server, so a skip here would mean the UI coverage vanished.
      - name: Status-bar UI
        env:
          SIDEPULSE_REQUIRE_UI_TESTS: "1"
        run: python -m pytest tests/test_status_bar_ui.py -v

      # Catch-all for anything the named steps above do not cover. The
      # clean-room install already ran, so skip rebuilding its virtualenv.
      - name: Full suite
        env:
          SIDEPULSE_SKIP_CLEAN_INSTALL: "1"
        run: python -m pytest tests -q
